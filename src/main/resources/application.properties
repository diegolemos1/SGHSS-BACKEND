spring.application.name=projetoBackEnd

# Server
server.port=8080
server.servlet.context-path=/sghss

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/sghss_db
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.root=INFO
logging.level.com.vidaplus.sghss=DEBUG

# SQL Initialization (comentar se já tiver dados)
# spring.sql.init.mode=always
